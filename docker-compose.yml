services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: scm
      POSTGRES_USER: scm_admin
      POSTGRES_PASSWORD: scm_admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scm_admin -d scm"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://scm_admin:scm_admin@db:5432/scm
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in backend/.env}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -m app.ai.worker
    environment:
      DATABASE_URL: postgresql://scm_admin:scm_admin@db:5432/scm
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in backend/.env}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
