services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scm}
      POSTGRES_USER: ${POSTGRES_USER:-scm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the project-root .env file}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scm_admin} -d ${POSTGRES_DB:-scm}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scm_admin}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the project-root .env file}@db:5432/${POSTGRES_DB:-scm}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the project-root .env file}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ml_models:/app/app/ml/models
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m app.ai.worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scm_admin}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the project-root .env file}@db:5432/${POSTGRES_DB:-scm}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the project-root .env file}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ml_models:/app/app/ml/models

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  ml_models:
